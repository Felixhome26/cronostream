<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CronoStream</title>
    <!-- Sets the theme before the first paint, so a light setup never flashes
         dark while the app script loads. Same key and rule as src/theme.ts,
         which takes over from here. Without it the page stays dark. -->
    <script>
      // Settings saved under the app's former name, LifeStream, move to the
      // new prefix once, before anything reads them.
      try {
        Object.keys(localStorage).forEach(function (key) {
          if (key.indexOf("lifestream.") !== 0) return;
          var renamed = "cronostream." + key.slice("lifestream.".length);
          if (localStorage.getItem(renamed) === null) {
            localStorage.setItem(renamed, localStorage.getItem(key));
          }
          localStorage.removeItem(key);
        });
      } catch (e) {}
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("cronostream.theme") === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
