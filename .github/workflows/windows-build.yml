# Builds the CronoStream Windows installer (NSIS setup .exe) and keeps it as
# a workflow artifact for download (Actions → this run → Artifacts).
#
# Only started by hand (Actions → "Build Windows installer" → Run workflow),
# because every run costs Actions minutes on the private repository.
#
# Needs the ffmpeg release `scripts/fetch-ffmpeg.mjs` asks for (built by
# ffmpeg-build.yml from a pushed `ffmpeg-*` tag); without it the build stops
# with a message saying so.
name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Reuses compiled Rust dependencies between runs: a first run takes
      # roughly twice as long as later ones.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # beforeBuildCommand fetches PDFium and the ffmpeg release; the latter
      # uses the GitHub CLI, which reads GH_TOKEN. The fetch scripts unpack
      # zips with `tar`, which only Windows' own bsdtar can do, so System32
      # goes first on PATH — for this step only: job-wide it would also put
      # System32\bash.exe (the WSL launcher) ahead of Git's bash and break
      # every bash step.
      - shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;$env:PATH"
          npx tauri build --bundles nsis
        env:
          GH_TOKEN: ${{ github.token }}

      # Short retention: artifacts count against the account's storage quota.
      - uses: actions/upload-artifact@v4
        with:
          name: cronostream-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
